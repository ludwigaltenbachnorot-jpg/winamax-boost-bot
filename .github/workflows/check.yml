name: Winamax Boost Check

on:
  schedule:
    # Verifie les nouveaux boosts toutes les 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - run: pip install -r requirements.txt

      - run: playwright install chromium --with-deps

      - run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          WINAMAX_COOKIES: ${{ secrets.WINAMAX_COOKIES }}

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json winamax_subscribers.json
          git diff --staged --quiet || git commit -m "Update bot state"
          git pull --rebase origin main
          git push
